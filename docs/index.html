<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PR Viz skill — demo</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #8b949e;
        --line: #30363d;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 1.5rem 1rem 3rem;
      }
      h1 { font-size: 1.35rem; margin: 0 0 0.35rem; }
      p { color: var(--muted); margin: 0 0 1rem; line-height: 1.5; }
      video {
        width: 100%;
        display: block;
        background: #000;
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      a { color: #4493f8; }
    </style>
  </head>
  <body>
    <main>
      <h1>/pr-viz skill demo</h1>
      <p>
        Full tour (~27s): overview → AI accepted → needs review → walkthrough.
        Also on the
        <a href="https://github.com/krzysztofgibert/pr-viz-skill#readme">skill README</a>
        as an autoplaying GIF.
      </p>
      <video
        src="demo.mp4"
        poster="demo.gif"
        controls
        autoplay
        muted
        loop
        playsinline
      ></video>
      <p>
        <a href="demo.mp4">Download MP4</a>
        ·
        <a href="https://pr-viz.com/d/sample">Live sample</a>
      </p>
    </main>
  </body>
</html>
