name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Skill files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Required community files
        run: |
          set -euo pipefail
          test -f README.md
          test -f LICENSE
          test -f CHANGELOG.md
          test -f CONTRIBUTING.md
          test -f .github/CODEOWNERS
          test -f SKILL.md
          test -f install.sh
          test -f .cursorrules
          test -f .windsurfrules
          test -f .gitignore
          test -f skills/pr-viz/SKILL.md
          test -f skills/pr-viz/host.json
          test -f .github/skills/pr-viz/SKILL.md
          test -f .cursor/skills/pr-viz/SKILL.md
          test -f .claude/skills/pr-viz/SKILL.md
          test -f .windsurf/skills/pr-viz/SKILL.md
          for file in skills/pr-viz/scripts/*.mjs skills/pr-viz/lib/*.mjs; do
            node --check "$file"
          done
          node skills/pr-viz/scripts/parse-pr-url.mjs https://github.com/acme/app/pull/12 | grep -q '"number":12'
          python3 -m json.tool skills/pr-viz/host.json >/dev/null
          # install.sh must stay LF — Windows CRLF breaks `curl | bash` shebang lines.
          # Keep this as one line: a flush-left heredoc body ends the YAML `|` block.
          python3 -c 'from pathlib import Path; d=Path("install.sh").read_bytes(); raise SystemExit("install.sh must use LF line endings" if b"\r" in d else 0)'

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run skill unit and CLI tests
        run: npm test

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Lint install.sh
        run: shellcheck -x install.sh

  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Lint workflows
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash)
          ./actionlint -color

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trivy filesystem (vuln, secret, misconfig)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          skip-dirs: docs
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript
          build-mode: none
      - uses: github/codeql-action/analyze@v3

  # Optional — set SNYK_TOKEN on krzysztofgibert/pr-viz-skill. Uses Snyk Code
  # (no package lock / OSS deps in this repo).
  snyk:
    name: Snyk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - id: gate
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SNYK_TOKEN is not set; Snyk is skipped"
          fi
      - if: steps.gate.outputs.enabled == 'true'
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code test
          args: --severity-threshold=high

  # Optional — set SONAR_TOKEN (+ SONAR_HOST_URL, and SONAR_ORGANIZATION for SonarCloud).
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SONAR_TOKEN is not set; SonarQube is skipped"
          fi
      - if: steps.gate.outputs.enabled == 'true'
        name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
